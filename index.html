<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Tip calculator app</title>

</head>
<body>

  <main>
    <header>
      <img class="logo" src="images/logo.svg" alt="">
    </header>
    <div id="calculator">
      <div class="bill-details">
        <section class="bill">
          <label class="bill-text">Bill</label>
          <img class="dollar-svg" src="images/icon-dollar.svg" alt="">
          <input type="number" name="bill" min="0" placeholder="0" id="bill-amount">
        </section>
        <section class="tip">
          <p class="tip-text">Select Tip %</p>
          <div class="tip-buttons">
            <button class="tip-btn">5%</button>
            <button class="tip-btn">10%</button>
            <button class="tip-btn">15%</button>
            <button class="tip-btn">25%</button>
            <button class="tip-btn">50%</button>
            <input class="tip-btn" type="number" name="custom" min="0" placeholder="Custom" id="custom-tip-btn">
          </div>
        </section>
        <section class="number-of-people">
          <label class="number-of-people-text">Number of People</label>
          <img class="person-svg" src="images/icon-person.svg" alt="">
          <input type="number" name="number-of-people" min="0" placeholder="0" id="number-of-people">
        </section>
      </div>
      <div class="calculation-box">
        <section class="tip-amount">
          <p class="text">Tip Amount <br><span>/ person</span></p>
          <p class="amount">$0.00</p>
        </section>
        <section class="total">
          <p class="text">Total <br><span>/ person</span></p>
          <p class="amount">$0.00</p>
        </section>
        <button class="reset-btn" type="reset">Reset</button>
      </div>
    </div>
  </main>

</body>
</html>
